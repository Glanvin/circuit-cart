# Cuts a release automatically whenever main moves.
#
# The bump is derived from the commits since the last tag, so nothing is
# edited by hand:
#
#   major  a `!` after the type/scope (feat(api)!: ...), or BREAKING CHANGE:
#          in a commit body
#   minor  feat:/feature:, or a subject starting with Add, Implement,
#          Introduce, Create, Build, Support, Enable or Develop
#   patch  everything else: fix:, docs:, chore:, any other type, a legacy fix
#          verb, and any subject it cannot place at all
#
# The highest result across the batch wins. Because releases are squash
# merges, main only ever sees one commit per release, so the conventional
# prefix that matters is the one on the squash commit subject:
#
#   Merge dev into main: employee portal...  ->  feat: employee portal...
#
# Miss the prefix and the legacy verb list still catches "Add ...". Miss both
# and it lands as a patch, which is the safe direction to fail.
#
# Run it by hand from the Actions tab when you need to override the derived
# bump: Actions -> Release -> Run workflow -> bump. "auto" is the default and
# is what a push to main uses.
#
# Requirements: contents: write (declared below), and a main branch that
# accepts a push from github-actions[bot].

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump derived from the commits
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

# Pushing the release commit and tag needs write access. Without this the push
# step fails with 403.
permissions:
  contents: write

# One release at a time. A second run waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Installed before anything else because the version step calls it.
      - name: Install the commit classifier
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/classify.py" <<'PYTHON'
          #!/usr/bin/env python3
          """Decide a version bump from commit messages.

          Prints the highest bump found (major|minor|patch) on stdout, or a
          markdown table when --explain is passed. Exits non-zero on bad input
          so the caller can refuse to guess.
          """
          import re
          import subprocess
          import sys

          # Order matters: it is what "highest wins" compares on.
          RANK = {"patch": 0, "minor": 1, "major": 2}

          TYPES = r"(feat|feature|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"

          # Their history predates conventional commits, so subjects are also
          # read for a leading verb. Anything unrecognised is a patch.
          LEGACY_MINOR = r"(add|implement|introduce|create|build|support|enable|develop)"
          LEGACY_PATCH = r"(fix|resolve|close|prevent|handle|correct|update|improve|refactor|" \
                        r"document|rename|move|remove|drop|tweak|restore|replace)"

          BREAKING = re.compile(r"^[\w ]*BREAKING[ -]CHANGE:", re.MULTILINE)
          # Named groups on purpose: the scope group and the breaking marker
          # group sit next to each other, and reading one as the other turns
          # every "feat(cart): ..." into a major release.
          CONVENTIONAL = re.compile(
              rf"^(?P<type>{TYPES})(?P<scope>\([^)]*\))?(?P<bang>!)?:\s", re.IGNORECASE)
          LEGACY_MINOR_RE = re.compile(rf"^\s*{LEGACY_MINOR}\b", re.IGNORECASE)
          LEGACY_PATCH_RE = re.compile(rf"^\s*{LEGACY_PATCH}\b", re.IGNORECASE)


          def classify(subject, body):
              if BREAKING.search(body or ""):
                  return "major", "BREAKING CHANGE in body"
              match = CONVENTIONAL.match(subject)
              if match:
                  kind = match.group("type").lower()
                  if match.group("bang"):
                      return "major", f"{kind}{match.group('scope') or ''}! breaking marker"
                  if kind in ("feat", "feature"):
                      return "minor", f"{kind}:"
                  return "patch", f"{kind}:"
              if LEGACY_MINOR_RE.match(subject):
                  return "minor", "legacy verb"
              if LEGACY_PATCH_RE.match(subject):
                  return "patch", "legacy verb"
              return "patch", "unrecognised, defaulting to patch"


          def commits(base):
              # Merge commits are skipped: a squash merge is an ordinary commit
              # and is scanned, a real merge commit and its parents are not
              # double counted.
              result = subprocess.run(
                  ["git", "log", "--no-merges", "--pretty=%h%x1f%s%x1f%b%x1e", f"{base}..HEAD"],
                  capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit(f"git log failed: {result.stderr.strip()}")
              found = []
              for record in result.stdout.split("\x1e"):
                  record = record.strip("\n")
                  if not record.strip():
                      continue
                  fields = record.split("\x1f")
                  if len(fields) < 2:
                      continue
                  found.append((fields[0], fields[1], fields[2] if len(fields) > 2 else ""))
              return found


          def main(argv):
              explain = "--explain" in argv
              positional = [arg for arg in argv if not arg.startswith("--")]
              if len(positional) != 1:
                  print("usage: classify.py <base-tag> [--explain]", file=sys.stderr)
                  return 2
              base = positional[0]
              if not base.lstrip("v")[:1].isdigit():
                  print(f"not a version tag: {base}", file=sys.stderr)
                  return 2

              highest, rows = "patch", []
              for sha, subject, body in commits(base):
                  kind, reason = classify(subject, body)
                  if RANK[kind] > RANK[highest]:
                      highest = kind
                  rows.append((sha, kind, reason, subject))

              if explain:
                  print("| Commit | Bump | Why | Subject |")
                  print("| --- | --- | --- | --- |")
                  for sha, kind, reason, subject in rows:
                      safe = subject.replace("|", "\\|")
                      print(f"| `{sha}` | {kind} | {reason} | {safe} |")
                  if not rows:
                      print("| _none_ | | | No commits since the tag. |")
                  print("")
                  print(f"**Result: {highest}**")
              else:
                  if not rows:
                      print("no commits to classify", file=sys.stderr)
                      return 1
                  print(highest)
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PYTHON
          chmod +x "$RUNNER_TEMP/classify.py"

      # Fetch the whole history and every tag: the previous version comes from
      # the newest reachable tag, so a shallow clone has nothing to read.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Pinned so a manual run can never be pointed at another branch from
          # the Run workflow dialog: the push below always targets main.
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the next version
        id: version
        env:
          # Empty on a push event, which the classifier treats as auto.
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Guard: a release commit at the tip means there is nothing new to
          # release. This is what stops a manual re-run from cutting a second
          # version for the same code. A push to main does not need it, because
          # GitHub does not trigger workflows from GITHUB_TOKEN pushes, so the
          # commit this job makes cannot re-trigger itself.
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^Release[[:space:]]v ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HEAD is already a release commit ($subject). Nothing to do."
            exit 0
          fi

          # The tag this release is being cut from: the newest one reachable
          # from HEAD, which is what "since the last release" means. Falls back
          # to a plain version sort, then to whatever index.php already says,
          # so a repo with no tags at all still works.
          base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ -z "$base" ]]; then
            base="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          fi
          if [[ -z "$base" ]]; then
            base="v$(sed -n "s/.*APP_VERSION', '\([0-9][0-9.]*\)'.*/\1/p" index.php)"
            echo "::notice::No tags found, starting from the version in index.php (${base})."
          fi

          core="${base#v}"
          major="${core%%.*}"
          rest="${core#*.}"
          minor="${rest%%.*}"
          patch="${rest##*.}"

          # Classify every commit since the tag and keep the highest result.
          # Python because re supports named groups: an off-by-one between the
          # scope group and the breaking-marker group is the difference between
          # releasing 0.2.0 and releasing 1.0.0.
          if derived="$(python3 "${RUNNER_TEMP}/classify.py" "${base}")"; then
            segment="${derived}"
          else
            echo "::error::The commit classifier failed; refusing to guess a version."
            exit 1
          fi

          echo "Commits since ${base} call for: ${segment}"

          case "${BUMP:-auto}" in
            auto|"") ;;
            patch|minor|major)
              echo "::notice::Overriding the derived bump '${segment}' with '${BUMP}'."
              segment="${BUMP}"
              ;;
            *)
              echo "::error::Unknown bump '${BUMP}'."
              exit 1
              ;;
          esac

          case "${segment}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac

          version="${major}.${minor}.${patch}"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "segment=${segment}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version} (${segment} bump on ${base})"

      - name: Explain the bump
        if: always() && steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Release v${{ steps.version.outputs.version }}"
            echo ""
            echo "Derived from the commits since \`${{ steps.version.outputs.base }}\`, "
            echo "highest result wins: **${{ steps.version.outputs.segment }}**."
            echo ""
            python3 "${RUNNER_TEMP}/classify.py" "${{ steps.version.outputs.base }}" --explain
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the version into the files
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # index.php carries the fallback the footer badge renders.
          sed -i -E "s/(APP_VERSION', ')[0-9][0-9.]*('.*)/\1${VERSION}\2/" index.php

          # .env.example documents the override. Only touch it when the line is
          # actually there, so this stays harmless if it is ever removed.
          if grep -q '^APP_VERSION=' .env.example; then
            sed -i -E "s/^(APP_VERSION=\")[0-9][0-9.]*(\")/\1${VERSION}\2/" .env.example
          fi

          # Catch a sed that silently matched nothing, and catch the two files
          # disagreeing, before anything is committed.
          if ! grep -q "APP_VERSION', '${VERSION}'" index.php; then
            echo "::error::index.php still does not say ${VERSION}"
            exit 1
          fi
          if grep -q '^APP_VERSION=' .env.example \
            && ! grep -q "^APP_VERSION=\"${VERSION}\"" .env.example; then
            echo "::error::.env.example disagrees with index.php about the version"
            exit 1
          fi

          git --no-pager diff

      - name: Commit, tag and push
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.php .env.example
          git commit -m "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"

          # Atomic so the branch and the tag move together: either the release
          # exists everywhere or nowhere, never a tag with no commit on main.
          # A protected main will refuse this.
          git push --atomic origin main "v${VERSION}"

      - name: Mirror the version onto dev
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail

          # main's release commit cannot simply be pushed onto dev: the squash
          # merge means main does not contain dev's commits, so that push is a
          # non-fast-forward and gets rejected. Instead dev gets its own commit
          # carrying the same edit, pushed as a fast-forward on top of it.
          #
          # This step never fails the release. If dev has moved since the fetch
          # the push is refused and the version is left to be synced by hand.
          git fetch --quiet origin dev

          if ! git checkout --quiet -B sync-dev origin/dev; then
            echo "::warning::Could not check out origin/dev; skipping the dev sync."
            exit 0
          fi

          sed -i -E "s/(APP_VERSION', ')[0-9][0-9.]*('.*)/\1${VERSION}\2/" index.php
          if grep -q '^APP_VERSION=' .env.example; then
            sed -i -E "s/^(APP_VERSION=\")[0-9][0-9.]*(\")/\1${VERSION}\2/" .env.example
          fi

          if git diff --quiet; then
            echo "::notice::dev already reports ${VERSION}; nothing to mirror."
            exit 0
          fi

          git add index.php .env.example
          git commit -m "Release v${VERSION}"

          if git push --quiet origin HEAD:dev; then
            echo "Mirrored v${VERSION} onto dev."
          else
            echo "::warning::Could not push the release commit to dev. main and the"
            echo "::warning::tag are published, but dev still reports the previous"
            echo "::warning::version. Apply the same two-line bump to dev by hand."
          fi

      - name: Open the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # --generate-notes fills in the commits since the previous tag.
          gh release create "$TAG" --generate-notes --title "$TAG"
